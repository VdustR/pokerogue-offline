name: Update offline builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: offline-build-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      should_build: ${{ steps.release_check.outputs.should_build }}
      should_release: ${{ steps.release_check.outputs.should_release }}
    steps:
      - name: Check out builder
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: builder

      - name: Check out official PokéRogue
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: pagefaultgames/pokerogue
          ref: main
          fetch-depth: 1
          submodules: recursive
          path: upstream

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: upstream/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            builder/pnpm-lock.yaml
            upstream/pnpm-lock.yaml

      - name: Check release identity
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          builder_sha="$(git -C builder rev-parse HEAD)"
          tag="offline-${upstream_sha:0:12}-builder-${builder_sha:0:8}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install builder dependencies
        if: steps.release_check.outputs.should_build == 'true'
        run: pnpm --dir builder install --frozen-lockfile

      - name: Apply fail-closed offline overlay
        if: steps.release_check.outputs.should_build == 'true'
        run: bash builder/scripts/apply-overlay.sh upstream

      - name: Install upstream dependencies
        if: steps.release_check.outputs.should_build == 'true'
        run: pnpm --dir upstream install --frozen-lockfile

      - name: Verify types and complete upstream test suite
        if: steps.release_check.outputs.should_build == 'true'
        run: |
          pnpm --dir upstream typecheck
          pnpm --dir upstream test:silent

      - name: Build and test normal offline edition
        if: steps.release_check.outputs.should_build == 'true'
        run: |
          pnpm --dir upstream build:offline
          node builder/e2e/offline-e2e.mjs upstream/dist
          bash builder/scripts/archive-build.sh upstream/dist release "pokerogue-offline-normal-${{ steps.release_check.outputs.upstream_sha }}"

      - name: Stage normal edition for GitHub Pages
        if: steps.release_check.outputs.should_release == 'true' && vars.DEPLOY_PWA_VARIANT == 'normal'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: upstream/dist

      - name: Build and test unlock-all offline edition
        if: steps.release_check.outputs.should_build == 'true'
        run: |
          pnpm --dir upstream build:offline:unlock-all
          node builder/e2e/offline-e2e.mjs upstream/dist
          bash builder/scripts/archive-build.sh upstream/dist release "pokerogue-offline-unlock-all-${{ steps.release_check.outputs.upstream_sha }}"

      - name: Stage unlock-all edition for GitHub Pages
        if: steps.release_check.outputs.should_release == 'true' && vars.DEPLOY_PWA_VARIANT == 'unlock-all'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: upstream/dist

      - name: Publish GitHub release
        if: steps.release_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_check.outputs.tag }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PokéRogue offline ${{ steps.release_check.outputs.upstream_sha }}" \
            --notes "Automated offline builds from official pagefaultgames/pokerogue main at ${{ steps.release_check.outputs.upstream_sha }}. Includes normal and unlock-all editions."

  deploy-pages:
    if: needs.build.outputs.should_release == 'true' && (vars.DEPLOY_PWA_VARIANT == 'normal' || vars.DEPLOY_PWA_VARIANT == 'unlock-all')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected edition to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
